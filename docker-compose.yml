services:
  proxy:
    build: ./proxy
    environment:
      # on = the API only answers our own frontend. off = also curl, Postman, etc.
      API_SAME_ORIGIN_ONLY: ${API_SAME_ORIGIN_ONLY:-off}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      CACHE_STORE: redis
      REDIS_HOST: redis
      # Other origins allowed to call the API from a browser. Empty = none, * = any.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  # Cache only: nothing is persisted, and the least recently used keys go first when memory runs out.
  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
