# Development: code mounted from the host, Vite and artisan serve with live reload.
name: hays-dev

services:
  backend:
    build:
      context: ./backend
      target: build
    # "composer setup" installs dependencies and creates .env from .env.example on a fresh clone.
    command: sh -c "composer setup --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr
      CACHE_STORE: redis
      REDIS_HOST: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${DEV_BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      # Dependencies live in a volume of their own: the ones installed on the host
      # may be built for another operating system.
      - frontend_node_modules:/app/node_modules
      # pnpm's download cache, kept out of the project folder.
      - pnpm_store:/pnpm-store
    environment:
      API_PROXY_TARGET: http://backend:8000
      npm_config_store_dir: /pnpm-store
      CI: "true"
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  pnpm_store:
