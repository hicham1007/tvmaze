# Serves the static bundle. Routing /api to the backend is the job of the
# reverse proxy in ../proxy, not of this container.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Fingerprinted by Vite, safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/shows/82) are resolved by React Router.
    location / {
        try_files $uri /index.html;
    }
}
